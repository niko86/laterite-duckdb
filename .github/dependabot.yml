# Keep the engine floors honest without hand-watching them.
#
# The laterite library crates version PER CRATE (the lockstep retired at
# laterite's 0.12 cycle), and this repo's own manifest comment states the
# policy: a PATCH under a floor is "the one upgrade this extension should
# always take, since a fix there is a fix to what the reader returns" — yet
# nothing took them (the lock sat one reference patch behind for a week with
# nobody told). Weekly grouped patch PRs close that gap.
#
# Engine MINOR bumps arrive as ONE grouped PR (`laterite-engine`). On a 0.x
# floor a minor is a breaking line (`^0.13` never resolves 0.14), and the
# engine crates require each other at matching minors — core 0.17 needs types
# 0.14 and reference 0.16 — so a single-crate minor resolves two copies of a
# leaf and the one-copy lock gate rejects it every time. Individual PRs could
# never merge; one grouped PR can. It is still an ADOPTION, not a version edit:
# it may need code behind it and may sit open until the extension's next
# release, which takes laterite's product number (extension X = laterite X's
# engine, checked by the laterite-parity job). Patches stay in their own
# always-take lane so an open adoption never drags them red.
version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Rust crates — the glue crate at the repo root.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # Listed first: dependabot puts a dependency in the FIRST group it
      # matches, and engine patches must fall through to cargo-patches.
      laterite-engine:
        patterns: ["laterite-ags4-*"]
        update-types: ["minor", "major"]
      cargo-patches:
        update-types: ["patch"]
