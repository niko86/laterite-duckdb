# PR-tier CI for the `laterite_ags4` DuckDB extension.
#
# Builds the loadable extension + runs its tests on every PR / push to main. The
# full per-DuckDB-version platform matrix is community-extensions' job on release
# — this is just the per-change dev gate.
#
# Runner: GitHub-hosted `ubuntu-latest`. This repo is PUBLIC, so standard runners are
# FREE + unlimited (GitHub Actions is free for public repos on standard runners), and
# a fork PR runs on a throwaway VM — never on owner hardware, network, or cache.
# Defense-in-depth retained on top: the fork-approval gate (Settings → Actions →
# "Require approval for all external contributors"), a read-only default GITHUB_TOKEN,
# and the branch ruleset (require-PR + block force-push/deletions).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: build + test only, no writes.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `extension-ci-tools` is the only submodule now — the laterite library crates
      # come from crates.io. Still recursive: the make targets below need it.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Dependency cache for the clippy/test half below. The job's whole cost is
      # ONE dependency: the bundled-test libduckdb-sys compiling DuckDB's C++
      # amalgamation for `cargo clippy --all-targets` / `cargo test` (the
      # loadable `make debug` build never compiles DuckDB — it links into a
      # host). rust-cache stores ~/.cargo + target/'s dependency artifacts in
      # the Actions cache service, so that compile happens once per
      # lockfile/toolchain change instead of once per push. Scope-safe with the
      # fork stance above: a PR restores only main's or its own caches, and its
      # writes never land in main's scope. `cache-on-failure` because a red
      # clippy run has already paid the compile — keep it for the fix-up push.
      - name: Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # Cheap fail-fast before any build. `--all` is safe now that the laterite
      # crates come from crates.io: it used to reach into the vendored `laterite/`
      # submodule (a path-dep workspace) and fmt-check code this repo does not own.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # The manifest version and the community descriptor version must agree — a
      # drift ships a mislabelled extension. (The number itself tracks the
      # laterite release; scripts/release.sh <version> stamps both.)
      - name: version consistency (Cargo.toml == description.yml)
        run: |
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          desc_v=$(grep -m1 '^  version:' description.yml | sed -E 's/^  version: *(.*)/\1/')
          echo "Cargo.toml=$cargo_v  description.yml=$desc_v"
          [ "$cargo_v" = "$desc_v" ] || {
            echo "::error::version drift: Cargo.toml=$cargo_v != description.yml=$desc_v"
            exit 1
          }

      # One copy of each engine crate, and the resolved versions printed on
      # every run. Cargo.toml states the invariant ("the workspace resolves ONE
      # copy — a split would compile two dictionaries into the binary") but
      # until now nothing held it, and it is genuinely breakable from outside:
      # reference 0.13.1 — a PATCH, the always-take lane — moved its parse
      # floor across a 0.x minor, so taking it beside core 0.13.1 resolves TWO
      # copies of laterite-ags4-parse. Under this gate that update PR goes red,
      # which is the correct answer: the fix is aligning the floors (usually
      # the next engine adoption), never shipping a split tree. The printed
      # pairs double as the lag report — what this binary actually builds
      # against, visible in every log without asking.
      - name: engine resolves to one copy per crate
        run: |
          pairs=$(awk -F'"' '/^name = "laterite-ags4-|^name = "laterite-transport/{name=$2; getline; ver=$2; print name" "ver}' Cargo.lock)
          echo "$pairs"
          dups=$(echo "$pairs" | awk '{print $1}' | sort | uniq -d)
          [ -z "$dups" ] || {
            echo "::error::engine crate resolved at two versions: $dups — a floor moved across a 0.x minor and split the tree; align the floors rather than shipping two copies"
            exit 1
          }

      # --- loadable build first, then the bundled-test build ---
      # The extension is built two ways that CAN'T share a target/: the
      # *loadable-extension* libduckdb-sys (the real artifact `make` builds) and the
      # *bundled-test* one (`cargo test`'s in-process DuckDB) are mutually exclusive,
      # so cargo rebuilds libduckdb-sys when you switch. Do the loadable work first,
      # then the bundled-test work — one loadable build, one bundled build.
      #
      # `make configure` = python venv + the matching DuckDB for sqllogictest;
      # `make debug` = the loadable cdylib + metadata; `make test_debug` = sqllogictest,
      # the functional gate: it LOADs the built extension and runs real SQL
      # (read_ags born-typing + joins, ags_groups/relationships/rules/dictionary).
      - name: make configure
        run: make configure

      - name: make debug (loadable cdylib)
        run: make debug

      - name: make test (sqllogictest)
        run: make test_debug

      # --- bundled-test work (one libduckdb-sys rebuild, shared) ---
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit + in-process e2e self-skip)
        run: cargo test
